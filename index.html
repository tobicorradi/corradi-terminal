  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__SITE_TITLE__</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="keywords" content="__SITE_KEYWORDS__" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="__SITE_THEME_COLOR__" />
    <link rel="canonical" href="__SITE_CANONICAL__" />
    <link rel="icon" href="__SITE_ICON__" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="__SITE_LOCALE__" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_TITLE__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_CANONICAL__" />
    <meta property="og:image" content="__SITE_OG_IMAGE__" />
    <meta property="og:image:alt" content="__SITE_OG_IMAGE_ALT__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_OG_IMAGE__" />
    <meta name="twitter:image:alt" content="__SITE_OG_IMAGE_ALT__" />
    <script>
      (() => {
        const storageKey = 'site-theme';
        const colors = {
          dark: '#080706',
          light: '#f4efe4',
        };

        let theme = 'dark';

        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === 'dark' || storedTheme === 'light') {
            theme = storedTheme;
          } else if (
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light';
          }
        } catch {
          theme = 'dark';
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', colors[theme]);
      })();
    </script>
    <script type="application/ld+json">
      __SITE_STRUCTURED_DATA__
    </script>
  </head>
