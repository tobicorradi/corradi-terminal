<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Tobías Corradi personal website preview</title>
  <desc id="og-desc">A terminal-inspired social preview card for Tobías Corradi.</desc>
  <defs>
    <pattern id="dot-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#c99361" fill-opacity="0.12" />
    </pattern>
    <linearGradient id="panel-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16110d" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <radialGradient id="ambient-glow" cx="30%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c99361" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#080706" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />
  <rect width="1200" height="630" fill="url(#ambient-glow)" />

  <rect x="44" y="44" width="1112" height="542" fill="url(#panel-glow)" stroke="#c99361" stroke-opacity="0.18" />
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#c99361" stroke-opacity="0.08" stroke-dasharray="1 9" />

  <g transform="translate(88 86)">
