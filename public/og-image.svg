  </g>

  <text x="88" y="210" fill="#c99361" font-family="'IBM Plex Mono', monospace" font-size="30" letter-spacing="6">// ENGINEERING LEAD @ THE FARMER'S DOG</text>
  <text x="88" y="318" fill="#f0bf8f" font-family="'IBM Plex Mono', monospace" font-size="110" font-weight="700" letter-spacing="6">TOBÍAS CORRADI|</text>
  <text x="88" y="392" fill="#c99361" font-family="'IBM Plex Mono', monospace" font-size="28" letter-spacing="8">REACT • TYPESCRIPT • NEXT.JS • REDUX</text>

  <text x="88" y="470" fill="#c99361" font-family="'IBM Plex Mono', monospace" font-size="30" letter-spacing="1.2">
    <tspan x="88" dy="0">Engineering Lead building clean and scalable frontend</tspan>
    <tspan x="88" dy="46">systems using React, TypeScript and Next.js.</tspan>
  </text>

